map $uri $cache_control {
    default                          "public, max-age=3600, stale-while-revalidate=86400";
    /pagefind/pagefind-entry.json    "no-cache";
    ~^/uploads/                      "public, max-age=31536000, immutable";
    ~^/images/emoji/                 "public, max-age=31536000, immutable";
    ~^/pagefind/(index|fragment)/    "public, max-age=31536000, immutable";
    ~^/pagefind/.*\.pf_meta$         "public, max-age=31536000, immutable";
    ~^/(assets|pagefind)/            "public, max-age=86400";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /srv/archive;
    index  index.html;
    charset utf-8;

    server_tokens      off;
    absolute_redirect  off;

    tcp_nopush  on;
    open_file_cache           max=10000 inactive=5m;
    open_file_cache_valid     5m;
    open_file_cache_errors    on;

    gzip_static   on;
    gzip_vary     on;
    gzip_proxied  any;

    add_header Cache-Control           $cache_control;
    add_header X-Content-Type-Options  nosniff;
    add_header Referrer-Policy         strict-origin-when-cross-origin;

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/index.html =404;
    }
}
